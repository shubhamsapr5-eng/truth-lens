version: '3.8'

services:
  truthlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truthlens_production
    restart: always
    ports:
      - "8501:8501"  # Streamlit Dashboard UI
      - "8000:8000"  # FastAPI REST Microservice
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
